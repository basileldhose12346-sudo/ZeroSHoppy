<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZeroShoppy — Best Quality for Best Price</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#fafafa;
--card:#ffffff;
--muted:#777;
--accent:#111;
--accent-2:#e7e7e7;
--shadow:0 6px 18px rgba(12,12,12,0.08);
}

*{box-sizing:border-box}

body{
margin:0;
font-family:"Poppins",sans-serif;
background:var(--bg);
}

/* NAVBAR */

.nav{
background:#fff;
border-bottom:1px solid var(--accent-2);
position:sticky;
top:0;
z-index:40;
}

.container{
max-width:1180px;
margin:auto;
padding:0 18px;
}

.nav-inner{
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 0;
}

/* HAMBURGER */

.menu-btn{
font-size:22px;
cursor:pointer;
margin-right:15px;
}

/* SIDEBAR */

.side-menu{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:#111;
color:white;
padding:20px;
transition:0.3s;
z-index:2000;
}

.side-menu a{
display:block;
color:white;
text-decoration:none;
margin:15px 0;
font-size:15px;
}

.side-menu h3{
margin-top:0;
}

.brand{font-weight:700;display:flex;flex-direction:column}
.brand .title{font-size:18px}
.brand .moto{font-size:12px;color:var(--muted)}

.nav-links{display:flex;gap:18px}
.nav-links a{text-decoration:none;color:var(--muted)}

.search{
border:1px solid var(--accent-2);
padding:8px 12px;
border-radius:999px;
display:flex;
}

.search input{
border:0;
outline:none;
}

/* PRODUCTS */

.section{padding:34px 18px}

.grid-row{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:16px;
}

.product{
background:#fff;
padding:14px;
border-radius:12px;
box-shadow:var(--shadow);
display:flex;
flex-direction:column;
height:240px;
}

.product img{
width:100%;
height:90px;
object-fit:contain;
border-radius:10px;
margin-bottom:6px;
}

.product-name{
font-size:13px;
height:36px;
overflow:hidden;
line-height:1.2;
margin-bottom:4px;
}

.product-price{
font-weight:600;
margin-bottom:6px;
}

.product-bottom{
margin-top:auto;
display:flex;
flex-direction:column;
gap:6px;
}

.product-bottom button{
background:#111;
color:white;
border:none;
padding:6px;
border-radius:6px;
cursor:pointer;
}

/* WATCH CARD */

.watch-card{
background:#fff;
padding:12px;
display:flex;
gap:16px;
border-radius:12px;
box-shadow:var(--shadow);
align-items:center;
margin-bottom:10px;
}

.watch-card img{
width:70px;
height:70px;
border-radius:8px;
}

.watch-card button{
margin-left:auto;
padding:6px 10px;
border:none;
background:#111;
color:white;
border-radius:6px;
cursor:pointer;
}

footer{
text-align:center;
color:var(--muted);
padding:24px;
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div id="sideMenu" class="side-menu">

<h3 id="userName"></h3>
<p id="userEmail"></p>

<a href="shoes.html">Shoes</a>
<a href="watches.html">Watches</a>
<a href="cart.html">Cart</a>

<hr>

<a onclick="logout()" style="cursor:pointer">Logout</a>

</div>

<script>

/* LOGIN CHECK */

const currentUser = JSON.parse(localStorage.getItem("currentUser"))

if(!currentUser){
window.location.href="login.html"
}

</script>

<header class="nav">
<div class="container nav-inner">

<div style="display:flex;align-items:center;gap:10px">

<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div class="brand">
<span class="title">ZeroShoppy</span>
<span class="moto">Best Quality for Best Price</span>
</div>

</div>

<nav class="nav-links">
<a href="shoes.html">Shoes</a>
<a href="watches.html">Watches</a>
<a href="cart.html">Cart</a>
</nav>

<div class="search">
<input type="search" placeholder="Search products" id="search">
</div>

</div>
</header>

<main class="container">

<section class="section">

<h3>LATEST SHOES</h3>

<div class="grid-row" id="productList"></div>

</section>

<section class="section">

<h3>FEATURED WATCHES</h3>

<div id="watchList"></div>

</section>

</main>

<footer>
© <span id="year"></span> ZeroShoppy
</footer>

<script>

document.getElementById("year").innerText=new Date().getFullYear()

/* SIDEBAR */

function toggleMenu(){

const menu=document.getElementById("sideMenu")

menu.style.left =
menu.style.left==="0px"
? "-260px"
: "0px"

}

/* USER INFO */

document.getElementById("userName").innerText=currentUser.username
document.getElementById("userEmail").innerText=currentUser.shipping?.email || ""

/* LOGOUT */

function logout(){
localStorage.removeItem("currentUser")
window.location.href="login.html"
}

/* CART */

function addToCart(product){

let cart = JSON.parse(localStorage.getItem("cart")) || []

cart.push(product)

localStorage.setItem("cart",JSON.stringify(cart))

alert("Added to Cart")

}

/* LOAD PRODUCTS */

async function loadProducts(){

const res=await fetch("http://localhost:5000/api/products")
const products=await res.json()

const shoes=document.getElementById("productList")
const watches=document.getElementById("watchList")

shoes.innerHTML=""
watches.innerHTML=""

products.forEach(p=>{

/* SHOES */

if(p.category==="shoes"){

let sizeOptions=""

if(p.sizes && p.sizes.length>0){

p.sizes.forEach(s=>{
if(s.stock>0){
sizeOptions+=`<option value="${s.size}">${s.size} (Stock:${s.stock})</option>`
}
})

}

const card=document.createElement("div")
card.className="product"

card.innerHTML=`
<img src="${p.image}">

<div class="product-name">${p.name}</div>

<div class="product-price">₹${p.price}</div>

<div class="product-bottom">

<select id="size-${p._id}">
${sizeOptions}
</select>

<button onclick="buy('${p._id}')">Buy</button>

<button onclick='addToCart(${JSON.stringify(p)})'>Add to Cart</button>

</div>
`

shoes.appendChild(card)

}

/* WATCHES */

if(p.category==="watches"){

const card=document.createElement("div")

card.className="watch-card"

card.innerHTML=`
<img src="${p.image}">
<div>
<b>${p.name}</b><br>
₹${p.price}<br>
Stock: ${p.stock}
</div>

<button onclick="buy('${p._id}')">Buy</button>
`

watches.appendChild(card)

}

})

}

/* BUY PRODUCT */

async function buy(productId){

const user=JSON.parse(localStorage.getItem("currentUser"))

if(!user || !user._id){
alert("Please login again")
return
}

if(user.role==="admin"){
alert("Admin cannot place orders")
return
}

let sizeSelect=document.getElementById("size-"+productId)

let size=null
if(sizeSelect) size=sizeSelect.value

const body={
productId:productId,
userId:user._id,
quantity:1,
size:size
}

const res=await fetch("http://localhost:5000/api/orders/place",{

method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(body)

})

const data=await res.json()

if(res.ok){
alert("Order placed successfully")
loadProducts()
}else{
alert(data.message)
}

}

/* SEARCH */

document.getElementById("search").addEventListener("input",function(){

let value=this.value.toLowerCase()

document.querySelectorAll(".product,.watch-card").forEach(card=>{

card.style.display=
card.innerText.toLowerCase().includes(value)
? ""
: "none"

})

})

/* INITIAL LOAD */

loadProducts()

</script>

</body>
</html>
