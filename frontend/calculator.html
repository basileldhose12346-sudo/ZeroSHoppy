<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calculator — ZeroShoppy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body{
    margin:0;
    font-family:Poppins, sans-serif;
    background:#fafafa;
  }
  .calc{
    width:260px;
    margin:60px auto;
    background:#fff;
    padding:16px;
    border-radius:12px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
  }
  .display{
    width:100%;
    height:45px;
    margin-bottom:12px;
    font-size:18px;
    padding:8px;
    text-align:right;
  }
  .keys{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  }
  button{
    padding:12px;
    font-size:16px;
    border:none;
    background:#e7e7e7;
    border-radius:8px;
    cursor:pointer;
  }
  button.operator{
    background:#111;
    color:#fff;
  }
  button.clear{
    background:#ff4d4d;
    color:#fff;
  }
</style>
</head>

<body>

<div class="calc">
  <input type="text" id="display" class="display" readonly>

  <div class="keys">
    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button class="operator" onclick="add('/')">÷</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button class="operator" onclick="add('*')">×</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button class="operator" onclick="add('-')">−</button>

    <button onclick="add('0')">0</button>
    <button onclick="add('.')">.</button>
    <button class="clear" onclick="clr()">C</button>
    <button class="operator" onclick="add('+')">+</button>

    <button class="operator" style="grid-column:span 4" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let display = document.getElementById("display");

  function add(value){
    display.value += value;
  }

  function clr(){
    display.value = "";
  }

  function calculate(){
    try{
      display.value = eval(display.value);
    }catch{
      display.value = "Error";
    }
  }
</script>

</body>
</html>
