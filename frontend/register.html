<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - ZeroShoppy</title>

  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #f5f5f5;
      height: 100vh;
      overflow-x: hidden;
    }

    .bg{
      position: fixed;
      inset: 0;
      background: url("http://localhost:5000/images/bg.jpg") center/cover no-repeat;
      filter: blur(10px);
      z-index: -1;
    }

    /* ================= NAVBAR ================= */
    .nav{
      background:#fff;
      border-bottom:1px solid #e8e8e8;
      position:sticky;top:0;z-index:99;
    }
    .container{
      max-width:1280px;margin:auto;
      padding:0 24px;height:48px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .backbtn{
      font-size:12px;color:#888;cursor:pointer;
      padding:5px 10px;border-radius:6px;
      background:#f0f0f0;user-select:none;
      font-family:"Poppins",sans-serif;
    }
    .backbtn:hover{background:#e0e0e0;color:#0e0e0e;}
    .brand{
      font-family:"Barlow Condensed",sans-serif;
      font-size:22px;font-weight:900;
      letter-spacing:-0.5px;color:#0e0e0e;
      text-decoration:none;
    }
    .brand span{color:#e8000d;}
    .nav-links{display:flex;gap:18px;}
    .nav-links a{text-decoration:none;color:#888;font-size:13px;font-weight:500;}
    .nav-links a:hover{color:#0e0e0e;}

    /* ================= FORM ================= */
    .wrapper{
      margin-top:40px;
      display:flex;align-items:center;justify-content:center;
      padding:20px;
    }
    form{
      width:480px;
      background:rgba(255,255,255,0.93);
      padding:28px 32px;
      border-radius:14px;
      box-shadow:0 0 32px rgba(0,0,0,0.25);
      box-sizing:border-box;
    }
    h2{
      font-family:"Barlow Condensed",sans-serif;
      font-size:26px;font-weight:900;
      text-transform:uppercase;letter-spacing:-0.5px;
      text-align:center;margin:0 0 22px 0;
    }
    label{
      display:block;font-size:11px;font-weight:700;
      letter-spacing:0.08em;text-transform:uppercase;
      color:#888;margin-top:14px;margin-bottom:5px;
    }
    input, textarea, select{
      width:100%;
      padding:9px 12px;
      margin:0;
      font-size:14px;
      border-radius:8px;
      border:1.5px solid #e8e8e8;
      font-family:"Poppins",sans-serif;
      outline:none;
      box-sizing:border-box;
      transition:border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus{border-color:#0e0e0e;}
    .row{display:flex;gap:12px;}
    .row > div{flex:1;}
    button{
      width:100%;padding:11px;
      margin-top:22px;
      background:#111;color:white;
      border:none;font-size:14px;
      border-radius:8px;cursor:pointer;
      font-weight:600;font-family:"Poppins",sans-serif;
      transition:background 0.2s;
    }
    button:hover{background:#333;}
  </style>
</head>

<body>

<div class="bg"></div>

<!-- ================= NAVBAR ================= -->
<header class="nav">
  <div class="container">
    <span class="backbtn" onclick="history.back()">⬅ Back</span>
    <a href="#" class="brand">ZERO<span>S</span>HOPPY</a>
    <nav class="nav-links">
      <a href="http://localhost:5000/login.html">Login</a>
    </nav>
  </div>
</header>

<!-- ================= CENTERED FORM ================= -->
<div class="wrapper">
<form id="regForm">

  <h2>Create Your Account</h2>

  <label>Username</label>
  <input id="username" type="text" minlength="5" maxlength="12" required>

  <label>Password</label>
  <input id="password" type="password" minlength="5" required>

  <label>Confirm Password</label>
  <input id="confirmPassword" type="password" minlength="5" required>

  <label>Name</label>
  <input id="name" required>

  <label>Email</label>
  <input id="email" type="email" required>

  <label>Shipping Address</label>
  <textarea id="address" rows="4" required></textarea>

  <label>ZIP Code</label>
  <input id="zip" type="text" maxlength="6" pattern="[0-9]{6}" required>

  <div class="row">
    <div>
      <label>City</label>
      <input id="city" required>
    </div>

    <div>
      <label>State</label>
      <input id="state" required>
    </div>
  </div>

  <label>Country</label>
  <select id="country" required>
    <option value="">Choose</option>
    <option>India</option>
    <option>USA</option>
    <option>Brazil</option>
    <option>UAE</option>
    <option>Argentina</option>
    <option>Portugal</option>
  </select>

  <label>Preferred Languages</label>
  <select id="languages" multiple style="height:80px;">
    <option>English</option>
    <option>Hindi</option>
    <option>Malayalam</option>
    <option>Tamil</option>
  </select>

  <button type="submit">Register</button>
</form>
</div>

<!-- ================= BACKEND CONNECTION ================= -->
<script>
document.getElementById("regForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const pass = password.value;
  const confirm = confirmPassword.value;

  if (pass !== confirm) {
    alert("Passwords do not match!");
    return;
  }

  // Password must contain at least one number and one special character
  const hasNumber = /[0-9]/.test(pass);
  const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\|,.<>\/?]/.test(pass);
  if(!hasNumber || !hasSpecial){
    alert("Password must contain at least one number and one special character (e.g. @, #, !)");
    return;
  }

  const shipping = {
    name: name.value,
    email: email.value,
    address: address.value,
    pincode: zip.value,
    city: city.value,
    state: state.value,
    country: country.value,
    languages: Array.from(languages.selectedOptions).map(o => o.value)
  };

  const body = {
    username: username.value,
    password: pass,
    shipping
  };

  try {
    const res = await fetch("http://localhost:5000/api/users/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.message || "Registration failed");
      return;
    }

    alert("Registration successful!");
    window.location.href = "http://localhost:5000/login.html";

  } catch (err) {
    alert("Network Error / Server not reachable");
  }

});
</script>

</body>
</html>
