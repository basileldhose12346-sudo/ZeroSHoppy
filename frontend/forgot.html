<!DOCTYPE html>
<html lang="en">
<head>
  <title>Forgot Password — ZeroShoppy</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      flex-direction:column;
      font-family:Poppins,sans-serif;
    }

    /* BACKGROUND */
    .bg{
      position:fixed;
      inset:0;
      background:url("http://localhost:5000/images/bg.jpg") center/cover no-repeat;
      filter:blur(10px);
      z-index:-1;
    }

    /* NAVBAR */
    .nav{
      background:#fff;
      border-bottom:1px solid #e8e8e8;
      position:sticky;top:0;z-index:100;
    }
    .container{
      max-width:1280px;margin:auto;
      padding:0 24px;height:48px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .brand{
      font-family:"Barlow Condensed",sans-serif;
      font-size:22px;font-weight:900;
      letter-spacing:-0.5px;color:#0e0e0e;
      text-decoration:none;
    }
    .brand span{color:#e8000d;}
    .nav-links{display:flex;gap:18px;}
    .nav-links a{text-decoration:none;color:#888;font-size:13px;font-weight:500;}
    .nav-links a:hover{color:#0e0e0e;}

    /* FORM */
    .wrapper{
      flex:1;display:flex;
      align-items:center;justify-content:center;
    }
    .box{
      background:rgba(255,255,255,0.93);
      padding:32px 28px;width:360px;
      border-radius:14px;
      box-shadow:0 0 32px rgba(0,0,0,0.25);
      box-sizing:border-box;
    }
    .box h2{
      font-family:"Barlow Condensed",sans-serif;
      font-size:28px;font-weight:900;
      text-transform:uppercase;letter-spacing:-0.5px;
      margin:0 0 24px 0;text-align:center;
    }
    .form-group{margin-bottom:14px;}
    .form-group label{
      display:block;font-size:11px;font-weight:700;
      letter-spacing:0.08em;text-transform:uppercase;
      color:#888;margin-bottom:5px;
    }
    .form-group input{
      width:100%;padding:9px 12px;
      border:1.5px solid #e8e8e8;border-radius:8px;
      font-family:"Poppins",sans-serif;font-size:14px;
      outline:none;box-sizing:border-box;transition:border-color 0.2s;
    }
    .form-group input:focus{border-color:#0e0e0e;}
    .btn-wrap{display:flex;justify-content:center;margin-top:18px;}
    button{
      width:50%;padding:10px;border:none;
      background:#111;color:#fff;border-radius:8px;
      font-weight:600;cursor:pointer;font-size:14px;
      font-family:"Poppins",sans-serif;transition:background 0.2s;
    }
    button:hover{background:#333;}
    .back-link{display:block;margin-top:16px;font-size:12px;color:#888;text-decoration:none;text-align:center;}
    .back-link:hover{color:#0e0e0e;}
    #msg{margin-top:12px;font-size:13px;font-weight:600;text-align:center;}
  </style>
</head>

<body>
<div class="bg"></div>

<!-- NAVBAR -->
<header class="nav">
  <div class="container">
    <a href="#" class="brand">ZERO<span>S</span>HOPPY</a>
    <nav class="nav-links">
      <a href="http://localhost:5000/login.html">Login</a>
      <a href="http://localhost:5000/register.html">Register</a>
    </nav>
  </div>
</header>

<!-- FORM -->
<div class="wrapper">
  <div class="box">
    <h2>Reset Password</h2>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter your username">
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newpass" placeholder="New password">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmpass" placeholder="Confirm new password">
    </div>

    <div class="btn-wrap">
      <button onclick="resetPassword()">Reset Password</button>
    </div>
    <div id="msg"></div>
    <a href="http://localhost:5000/login.html" class="back-link">← Back to Login</a>
  </div>
</div>

<script>
async function resetPassword(){
  const username = document.getElementById("username").value.trim()
  const newpass  = document.getElementById("newpass").value
  const confirmpass = document.getElementById("confirmpass").value
  const msg = document.getElementById("msg")

  if(!username || !newpass || !confirmpass){
    msg.style.color="red"
    msg.innerText="Please fill all fields"
    return
  }

  if(newpass !== confirmpass){
    msg.style.color="red"
    msg.innerText="Passwords do not match"
    return
  }

  if(newpass.length < 5){
    msg.style.color="red"
    msg.innerText="Password must be at least 5 characters"
    return
  }

  const res = await fetch("http://localhost:5000/api/users/reset-password",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username, newPassword: newpass})
  })

  const data = await res.json()

  if(res.ok){
    msg.style.color="green"
    msg.innerText="Password reset successful!"
    setTimeout(()=> window.location.href="http://localhost:5000/login.html", 1500)
  } else {
    msg.style.color="red"
    msg.innerText = data.message || "Reset failed"
  }
}
</script>
</body>
</html>
