<!DOCTYPE html>
<html lang="en">
<head>
  <title>Forgot Password — ZeroShoppy</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      flex-direction:column;
      font-family:Poppins,sans-serif;
    }

    /* BACKGROUND */
    .bg{
      position:fixed;
      inset:0;
      background:url("http://localhost:5000/images/bg.jpg") center/cover no-repeat;
      filter:blur(10px);
      z-index:-1;
    }

    /* NAVBAR */
    .nav{
      background:#fff;
      border-bottom:1px solid #e7e7e7;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
    }
    .container{
      max-width:1180px;
      margin:auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .brand{font-weight:700;display:flex;flex-direction:column;}
    .brand .title{font-size:18px;}
    .brand .moto{font-size:12px;color:gray;}
    .nav-links{display:flex;gap:18px;}
    .nav-links a{text-decoration:none;color:gray;font-size:14px;}

    /* FORM */
    .wrapper{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .box{
      background:rgba(255,255,255,0.92);
      padding:30px;
      width:360px;
      border-radius:12px;
      box-shadow:0 0 25px rgba(0,0,0,0.3);
      text-align:center;
    }
    .box h2{margin-bottom:20px;}
    .form-group{text-align:left;margin-bottom:14px;}
    .form-group label{font-size:13px;font-weight:600;display:block;margin-bottom:4px;}
    .form-group input{
      width:100%;
      padding:9px;
      border:1px solid #ccc;
      border-radius:6px;
      box-sizing:border-box;
    }
    button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      background:#111;
      color:#fff;
      border-radius:8px;
      font-weight:600;
      cursor:pointer;
      font-size:15px;
    }
    button:hover{opacity:0.85;}
    .back-link{display:block;margin-top:14px;font-size:13px;color:gray;text-decoration:none;}
    #msg{margin-top:12px;font-size:14px;font-weight:600;}
  </style>
</head>

<body>
<div class="bg"></div>

<!-- NAVBAR -->
<header class="nav">
  <div class="container">
    <div class="brand">
      <span class="title">ZeroShoppy</span>
      <span class="moto">Best Quality for Best Price</span>
    </div>
    <nav class="nav-links">
      <a href="http://localhost:5000/login.html">Login</a>
      <a href="http://localhost:5000/register.html">Register</a>
    </nav>
  </div>
</header>

<!-- FORM -->
<div class="wrapper">
  <div class="box">
    <h2>Reset Password</h2>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter your username">
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newpass" placeholder="New password">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmpass" placeholder="Confirm new password">
    </div>

    <button onclick="resetPassword()">Reset Password</button>
    <div id="msg"></div>
    <a href="http://localhost:5000/login.html" class="back-link">← Back to Login</a>
  </div>
</div>

<script>
async function resetPassword(){
  const username = document.getElementById("username").value.trim()
  const newpass  = document.getElementById("newpass").value
  const confirmpass = document.getElementById("confirmpass").value
  const msg = document.getElementById("msg")

  if(!username || !newpass || !confirmpass){
    msg.style.color="red"
    msg.innerText="Please fill all fields"
    return
  }

  if(newpass !== confirmpass){
    msg.style.color="red"
    msg.innerText="Passwords do not match"
    return
  }

  if(newpass.length < 5){
    msg.style.color="red"
    msg.innerText="Password must be at least 5 characters"
    return
  }

  const res = await fetch("http://localhost:5000/api/users/reset-password",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username, newPassword: newpass})
  })

  const data = await res.json()

  if(res.ok){
    msg.style.color="green"
    msg.innerText="Password reset successful!"
    setTimeout(()=> window.location.href="http://localhost:5000/login.html", 1500)
  } else {
    msg.style.color="red"
    msg.innerText = data.message || "Reset failed"
  }
}
</script>
</body>
</html>
