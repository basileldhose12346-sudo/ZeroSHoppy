<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZeroShoppy Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--dark:#0e0e0e;--accent:#c8f230;--border:#e8e8e8;--muted:#888;--bg:#f7f7f5;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Poppins",sans-serif;background:var(--bg);}

.nav{
  background:var(--dark);padding:0 24px;height:58px;
  display:flex;justify-content:space-between;align-items:center;
}
.nav-brand{
  font-family:"Barlow Condensed",sans-serif;
  font-size:24px;font-weight:900;color:#fff;letter-spacing:-0.5px;
}
.nav-brand span{color:var(--accent);}
.nav-tag{
  font-size:11px;font-weight:700;letter-spacing:0.12em;
  text-transform:uppercase;background:var(--accent);
  color:var(--dark);padding:3px 10px;border-radius:999px;
}
.logout-btn{
  background:transparent;color:rgba(255,255,255,0.6);
  border:1px solid rgba(255,255,255,0.2);padding:6px 16px;
  border-radius:6px;cursor:pointer;font-family:Poppins;font-size:13px;
  transition:all 0.2s;
}
.logout-btn:hover{background:rgba(255,255,255,0.1);color:#fff;}

.wrapper{display:flex;height:calc(100vh - 58px);}

.sidebar{
  width:220px;background:#fff;
  border-right:1px solid var(--border);
  padding:24px 16px;display:flex;flex-direction:column;gap:4px;
}
.sidebar-btn{
  width:100%;padding:10px 14px;background:transparent;
  color:var(--dark);border:none;cursor:pointer;
  border-radius:8px;font-family:Poppins;font-size:14px;font-weight:500;
  text-align:left;transition:background 0.15s;
}
.sidebar-btn:hover{background:#f0f0ee;}
.sidebar-btn.active{background:var(--dark);color:#fff;}

.content{flex:1;padding:32px;overflow:auto;background:var(--bg);}

.section{display:none;}
.section.active{display:block;}

/* DASHBOARD */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px;}
.stat{
  background:#fff;border-radius:12px;padding:24px;
  border:1px solid var(--border);
}
.stat-num{
  font-family:"Barlow Condensed",sans-serif;
  font-size:48px;font-weight:900;line-height:1;margin-bottom:4px;
}
.stat-label{font-size:13px;color:var(--muted);font-weight:500;}

/* FORM */
.form-wrap{background:#fff;border-radius:12px;padding:28px;border:1px solid var(--border);margin-bottom:32px;}
.form-wrap h3{
  font-family:"Barlow Condensed",sans-serif;
  font-size:24px;font-weight:800;text-transform:uppercase;
  margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--dark);
}
.form-row{display:flex;gap:12px;}
.form-row > *{flex:1;}
.form-group{margin-bottom:16px;}
.form-group label{
  display:block;font-size:12px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;
}
.form-group input,
.form-group select,
.form-group textarea{
  width:100%;padding:9px 12px;border:1.5px solid var(--border);
  border-radius:8px;font-family:Poppins;font-size:14px;
  outline:none;transition:border-color 0.2s;background:#fff;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{border-color:var(--dark);}
.form-group textarea{resize:vertical;min-height:90px;}

/* MULTI IMAGE UPLOAD */
.upload-zone{
  border:2px dashed var(--border);border-radius:10px;
  padding:24px;text-align:center;cursor:pointer;
  transition:border-color 0.2s,background 0.2s;
  background:#fafafa;
}
.upload-zone:hover{border-color:#aaa;background:#f5f5f5;}
.upload-zone input{display:none;}
.upload-icon{font-size:32px;margin-bottom:8px;}
.upload-text{font-size:14px;color:var(--muted);}
.upload-text strong{color:var(--dark);}

.preview-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
  margin-top:16px;
}
.preview-item{
  position:relative;aspect-ratio:1;border-radius:8px;
  overflow:hidden;border:2px solid var(--border);background:#f0f0ee;
}
.preview-item img{width:100%;height:100%;object-fit:contain;padding:6px;}
.preview-item .remove-img{
  position:absolute;top:4px;right:4px;
  background:rgba(0,0,0,0.6);color:#fff;
  border:none;border-radius:50%;width:20px;height:20px;
  font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.primary-badge{
  position:absolute;bottom:4px;left:4px;
  background:var(--accent);color:var(--dark);
  font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;
  letter-spacing:0.06em;text-transform:uppercase;
}

/* SIZE TABLE */
.size-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px;}
.size-item label{
  display:block;font-size:11px;font-weight:600;color:var(--muted);
  margin-bottom:4px;letter-spacing:0.05em;
}
.size-item input{padding:8px;width:100%;}

/* SUBMIT BTN */
.submit-btn{
  padding:12px 32px;background:var(--dark);color:#fff;
  border:none;border-radius:8px;font-family:Poppins;
  font-size:14px;font-weight:600;cursor:pointer;
  transition:background 0.2s;letter-spacing:0.04em;
}
.submit-btn:hover{background:#333;}

/* PRODUCT LIST */
.list-wrap{background:#fff;border-radius:12px;padding:28px;border:1px solid var(--border);}
.list-wrap h3{
  font-family:"Barlow Condensed",sans-serif;
  font-size:24px;font-weight:800;text-transform:uppercase;
  margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--dark);
}

.card{
  display:flex;align-items:center;gap:16px;
  padding:14px;border:1px solid var(--border);
  border-radius:10px;margin-bottom:10px;
  background:#fafafa;transition:border-color 0.2s;
}
.card:hover{border-color:#ccc;}
.card img{width:56px;height:56px;object-fit:contain;border-radius:8px;background:#f0f0ee;padding:4px;flex-shrink:0;}
.card-info{flex:1;}
.card-name{font-size:14px;font-weight:600;}
.card-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.card-actions{display:flex;gap:8px;}
.btn-view{
  padding:6px 14px;background:#f0f0ee;color:var(--dark);
  border:none;border-radius:6px;font-family:Poppins;font-size:12px;font-weight:600;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;
}
.btn-delete{
  padding:6px 14px;background:#fee2e2;color:#dc2626;
  border:none;border-radius:6px;font-family:Poppins;font-size:12px;font-weight:600;cursor:pointer;
}
.btn-complete{
  padding:6px 14px;background:#dcfce7;color:#16a34a;
  border:none;border-radius:6px;font-family:Poppins;font-size:12px;font-weight:600;cursor:pointer;
}

/* TOAST */
.toast{
  position:fixed;top:24px;right:24px;
  background:#fff;border-radius:10px;padding:14px 20px;
  box-shadow:0 8px 32px rgba(0,0,0,0.15);
  display:flex;align-items:center;gap:10px;
  font-weight:600;font-size:14px;z-index:9999;
  transform:translateX(120%);
  transition:transform 0.4s cubic-bezier(.2,.9,.2,1);
  border-left:4px solid #22c55e;
}
.toast.show{transform:translateX(0);}
.toast.error{border-left-color:#ef4444;}
</style>
</head>
<body>

<div id="toast" class="toast">✓ <span id="toastMsg"></span></div>

<div class="nav">
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="nav-brand">ZERO<span>S</span>HOPPY</div>
    <span class="nav-tag">Admin</span>
  </div>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="wrapper">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <button class="sidebar-btn active" onclick="show('dashboard',this)">📊 Dashboard</button>
    <button class="sidebar-btn" onclick="show('products',this)">👟 Products</button>
    <button class="sidebar-btn" onclick="show('users',this)">👥 Users</button>
    <button class="sidebar-btn" onclick="show('orders',this)">📦 Orders</button>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- DASHBOARD -->
    <div id="dashboard" class="section active">
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-num" id="totalProducts">0</div>
          <div class="stat-label">Total Products</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="totalOrders">0</div>
          <div class="stat-label">Active Orders</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="revenue">₹0</div>
          <div class="stat-label">Total Revenue</div>
        </div>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div id="products" class="section">
      <div class="form-wrap">
        <h3>Add Product</h3>

        <div class="form-row">
          <div class="form-group">
            <label>Product Name</label>
            <input id="pname" placeholder="e.g. Nike Air Max 270">
          </div>
          <div class="form-group">
            <label>Price (₹)</label>
            <input id="pprice" type="number" placeholder="e.g. 4999">
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="pcategory" onchange="toggleCategory()">
              <option value="shoes">Shoes</option>
              <option value="watches">Watches</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="pdesc" placeholder="Describe the product — features, materials, use case…"></textarea>
        </div>

        <!-- MULTI IMAGE UPLOAD -->
        <div class="form-group">
          <label>Product Images (3–5 images, first = primary)</label>
          <div class="upload-zone" onclick="document.getElementById('pimages').click()">
            <input type="file" id="pimages" accept="image/*" multiple onchange="previewImages(event)">
            <div class="upload-icon">📷</div>
            <div class="upload-text"><strong>Click to upload</strong> — 3 to 5 images<br>First image will be the main display image</div>
          </div>
          <div class="preview-grid" id="previewGrid"></div>
        </div>

        <!-- WATCH STOCK -->
        <div id="watchStock">
          <div class="form-group">
            <label>Stock Quantity</label>
            <input id="pstock" type="number" placeholder="e.g. 50">
          </div>
        </div>

        <!-- SHOE SIZE STOCK -->
        <div id="shoeStock" style="display:none">
          <div class="form-group">
            <label>Size-wise Stock</label>
            <div class="size-grid">
              <div class="size-item"><label>Size 7</label><input id="s7" type="number" placeholder="0"></div>
              <div class="size-item"><label>Size 8</label><input id="s8" type="number" placeholder="0"></div>
              <div class="size-item"><label>Size 9</label><input id="s9" type="number" placeholder="0"></div>
              <div class="size-item"><label>Size 10</label><input id="s10" type="number" placeholder="0"></div>
            </div>
          </div>
        </div>

        <button class="submit-btn" onclick="addProduct()">Add Product →</button>
      </div>

      <div class="list-wrap">
        <h3>All Products</h3>
        <div id="productList"></div>
      </div>
    </div>

    <!-- USERS -->
    <div id="users" class="section">
      <div class="list-wrap">
        <h3>All Users</h3>
        <div id="userList"></div>
      </div>
    </div>

    <!-- ORDERS -->
    <div id="orders" class="section">
      <div class="list-wrap">
        <h3>Active Orders</h3>
        <div id="orderList"></div>
      </div>
    </div>

  </div>
</div>

<script>
function show(id, btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
  document.getElementById(id).classList.add("active")
  document.querySelectorAll(".sidebar-btn").forEach(b=>b.classList.remove("active"))
  if(btn) btn.classList.add("active")
}

function showToast(msg,isError=false){
  const t=document.getElementById("toast")
  document.getElementById("toastMsg").innerText=msg
  t.classList.remove("error")
  if(isError) t.classList.add("error")
  t.classList.add("show")
  setTimeout(()=>t.classList.remove("show"),2800)
}

function toggleCategory(){
  if(pcategory.value==="shoes"){
    shoeStock.style.display="block"
    watchStock.style.display="none"
  } else {
    shoeStock.style.display="none"
    watchStock.style.display="block"
  }
}

/* MULTI IMAGE PREVIEW */
let selectedFiles = []

function previewImages(event){
  const files = Array.from(event.target.files)
  if(files.length < 3){
    showToast("Please select at least 3 images", true)
    return
  }
  if(files.length > 5){
    showToast("Maximum 5 images allowed", true)
    return
  }
  selectedFiles = files
  const grid = document.getElementById("previewGrid")
  grid.innerHTML = ""
  files.forEach((file,i)=>{
    const reader = new FileReader()
    reader.onload = e => {
      const item = document.createElement("div")
      item.className = "preview-item"
      item.innerHTML = `
        <img src="${e.target.result}">
        ${i===0 ? '<div class="primary-badge">Primary</div>' : ''}
      `
      grid.appendChild(item)
    }
    reader.readAsDataURL(file)
  })
}

/* ADD PRODUCT */
async function addProduct(){
  if(!pname.value || !pprice.value){
    showToast("Please fill name and price", true); return
  }
  if(selectedFiles.length < 3){
    showToast("Please upload at least 3 images", true); return
  }

  const data = {
    name: pname.value,
    price: Number(pprice.value),
    category: pcategory.value,
    description: document.getElementById("pdesc").value
  }

  if(pcategory.value==="shoes"){
    data.sizes=[
      {size:7,stock:Number(s7.value||0)},
      {size:8,stock:Number(s8.value||0)},
      {size:9,stock:Number(s9.value||0)},
      {size:10,stock:Number(s10.value||0)}
    ]
  } else {
    data.stock = Number(pstock.value||0)
  }

  const formData = new FormData()
  selectedFiles.forEach(f => formData.append("images", f))
  formData.append("data", JSON.stringify(data))

  const res = await fetch("http://localhost:5000/api/products/add",{
    method:"POST", body:formData
  })
  const result = await res.json()

  if(!res.ok){
    showToast("Failed: " + (result.error||"Unknown error"), true); return
  }

  showToast("Product added! Page auto-generated ✓")

  // Reset
  pname.value="" ; pprice.value="" ; pstock.value="" ; s7.value="" ; s8.value="" ; s9.value="" ; s10.value=""
  document.getElementById("pdesc").value=""
  document.getElementById("pimages").value=""
  document.getElementById("previewGrid").innerHTML=""
  selectedFiles=[]

  loadProducts()
}

/* LOAD PRODUCTS */
async function loadProducts(){
  const res=await fetch("http://localhost:5000/api/products")
  const products=await res.json()
  totalProducts.innerText=products.length
  let html=""
  products.forEach(p=>{
    html+=`
    <div class="card">
      <img src="${p.image}" onerror="this.style.display='none'">
      <div class="card-info">
        <div class="card-name">${p.name}</div>
        <div class="card-meta">₹${p.price} · ${p.category} · ${(p.images||[]).length} image(s)</div>
      </div>
      <div class="card-actions">
        <a href="http://localhost:5000/product-${p._id}.html" target="_blank" class="btn-view">View Page</a>
        <button class="btn-delete" onclick="deleteProduct('${p._id}')">Delete</button>
      </div>
    </div>`
  })
  productList.innerHTML=html
}

async function deleteProduct(id){
  if(!confirm("Delete this product?")) return
  await fetch("http://localhost:5000/api/products/"+id,{method:"DELETE"})
  showToast("Product deleted")
  loadProducts()
}

/* LOAD USERS */
async function loadUsers(){
  const res=await fetch("http://localhost:5000/api/users")
  const users=await res.json()
  let html=""
  users.forEach(u=>{
    html+=`
    <div class="card">
      <div class="card-info">
        <div class="card-name">${u.username}</div>
        <div class="card-meta">${u.role} ${u.shipping?.email ? '· '+u.shipping.email : ''}</div>
      </div>
      <div class="card-actions">
        <button class="btn-delete" onclick="deleteUser('${u._id}')">Delete</button>
      </div>
    </div>`
  })
  userList.innerHTML=html||'<p style="color:var(--muted)">No users found.</p>'
}

async function deleteUser(id){
  if(!confirm("Delete this user?")) return
  await fetch("http://localhost:5000/api/users/"+id,{method:"DELETE"})
  showToast("User deleted")
  loadUsers()
}

/* LOAD ORDERS */
async function loadOrders(){
  const res=await fetch("http://localhost:5000/api/orders")
  const orders=await res.json()
  totalOrders.innerText=orders.length
  let revenueTotal=0
  let html=""
  orders.forEach(o=>{
    revenueTotal+=o.product.price*o.product.quantity
    html+=`
    <div class="card">
      <div class="card-info">
        <div class="card-name">${o.product.name} ${o.product.size ? '— Size '+o.product.size : ''}</div>
        <div class="card-meta">Buyer: ${o.buyer.username} · ₹${o.product.price} · Qty: ${o.product.quantity}</div>
        <div class="card-meta" style="margin-top:2px">📍 ${o.buyer.address||"No address"}</div>
      </div>
      <div class="card-actions">
        <button class="btn-complete" onclick="completeOrder('${o._id}')">Mark Complete</button>
      </div>
    </div>`
  })
  revenue.innerText="₹"+revenueTotal
  orderList.innerHTML=html||'<p style="color:var(--muted)">No active orders.</p>'
}

async function completeOrder(id){
  await fetch("http://localhost:5000/api/orders/"+id,{method:"DELETE"})
  showToast("Order marked complete")
  loadOrders()
}

function logout(){
  localStorage.removeItem("currentUser")
  window.location="http://localhost:5000/login.html"
}

loadProducts()
loadUsers()
loadOrders()
</script>
</body>
</html>
