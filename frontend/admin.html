<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZeroShoppy Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:"Poppins",sans-serif;
background:#f4f4f4;
}

/* NAVBAR */

.nav{
background:#fff;
border-bottom:1px solid #ddd;
padding:12px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.brand{
font-weight:700;
font-size:18px;
}

/* LAYOUT */

.wrapper{
display:flex;
height:calc(100vh - 50px);
}

/* SIDEBAR */

.sidebar{
width:220px;
background:#111;
color:white;
padding:20px;
}

.sidebar button{
width:100%;
padding:10px;
margin:8px 0;
background:#222;
color:white;
border:none;
cursor:pointer;
}

.sidebar button:hover{
background:#444;
}

/* CONTENT */

.content{
flex:1;
padding:25px;
overflow:auto;
background:white;
}

.section{
display:none;
}

.section.active{
display:block;
}

/* DASHBOARD */

.dashboard{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:20px;
}

.stat{
background:#111;
color:white;
padding:20px;
border-radius:10px;
text-align:center;
}

/* PRODUCT CARD */

.card{
border:1px solid #ddd;
padding:12px;
margin-top:10px;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.card img{
width:50px;
height:50px;
object-fit:cover;
border-radius:6px;
margin-right:10px;
}

/* INPUT */

input,select{
padding:8px;
margin:5px;
}

/* BUTTONS */

.action{
background:black;
color:white;
border:none;
padding:6px 10px;
cursor:pointer;
}

.complete{
background:green;
color:white;
border:none;
padding:6px 10px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="nav">

<div class="brand">ZeroShoppy Admin</div>

<button onclick="logout()">Logout</button>

</div>


<div class="wrapper">

<!-- SIDEBAR -->

<div class="sidebar">

<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('products')">Products</button>
<button onclick="show('users')">Users</button>
<button onclick="show('orders')">Orders</button>

</div>

<!-- CONTENT -->

<div class="content">

<!-- DASHBOARD -->

<div id="dashboard" class="section active">

<h2>Dashboard</h2>

<div class="dashboard">

<div class="stat">
<h3 id="totalProducts">0</h3>
Products
</div>

<div class="stat">
<h3 id="totalOrders">0</h3>
Orders
</div>

<div class="stat">
<h3 id="revenue">₹0</h3>
Revenue
</div>

</div>

</div>


<!-- PRODUCTS -->

<div id="products" class="section">

<h2>Add Product</h2>

<input id="pname" placeholder="Product Name">

<input id="pprice" type="number" placeholder="Price">

<select id="pcategory" onchange="toggleCategory()">
<option value="shoes">Shoes</option>
<option value="watches">Watches</option>
</select>

<input id="pimage" placeholder="Image URL">

<!-- WATCH STOCK -->

<div id="watchStock">
<input id="pstock" type="number" placeholder="Watch Stock">
</div>

<!-- SHOE SIZE STOCK -->

<div id="shoeStock" style="display:none">

<h4>Size Wise Stock</h4>

Size 7 <input id="s7" type="number"><br>
Size 8 <input id="s8" type="number"><br>
Size 9 <input id="s9" type="number"><br>
Size 10 <input id="s10" type="number"><br>

</div>

<button class="action" onclick="addProduct()">Add Product</button>

<h3>Products</h3>

<div id="productList"></div>

</div>


<!-- USERS -->

<div id="users" class="section">

<h2>Users</h2>

<div id="userList"></div>

</div>


<!-- ORDERS -->

<div id="orders" class="section">

<h2>Orders</h2>

<div id="orderList"></div>

</div>

</div>

</div>


<script>

/* SECTION SWITCH */

function show(id){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

/* CATEGORY SWITCH */

function toggleCategory(){

if(pcategory.value==="shoes"){

shoeStock.style.display="block"
watchStock.style.display="none"

}else{

shoeStock.style.display="none"
watchStock.style.display="block"

}

}

/* ADD PRODUCT */

async function addProduct(){

let body={
name:pname.value,
price:Number(pprice.value),
category:pcategory.value,
image:pimage.value
}

if(pcategory.value==="shoes"){

body.sizes=[

{size:7,stock:Number(s7.value||0)},
{size:8,stock:Number(s8.value||0)},
{size:9,stock:Number(s9.value||0)},
{size:10,stock:Number(s10.value||0)}

]

}else{

body.stock=Number(pstock.value)

}

await fetch("http://localhost:5000/api/products/add",{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(body)

})

loadProducts()

}

/* LOAD PRODUCTS */

async function loadProducts(){

const res=await fetch("http://localhost:5000/api/products")
const products=await res.json()

totalProducts.innerText=products.length

let html=""

products.forEach(p=>{

html+=`
<div class="card">

<div style="display:flex;align-items:center">

<img src="${p.image}">

<div>

<b>${p.name}</b><br>
₹${p.price}

</div>

</div>

<button class="action" onclick="deleteProduct('${p._id}')">Delete</button>

</div>
`

})

productList.innerHTML=html

}

/* DELETE PRODUCT */

async function deleteProduct(id){

await fetch("http://localhost:5000/api/products/"+id,{method:"DELETE"})
loadProducts()

}

/* LOAD USERS */

async function loadUsers(){

const res=await fetch("http://localhost:5000/api/users")
const users=await res.json()

let html=""

users.forEach(u=>{

html+=`

<div class="card">

${u.username} (${u.role})

<button class="action" onclick="deleteUser('${u._id}')">Delete</button>

</div>

`

})

userList.innerHTML=html

}

/* DELETE USER */

async function deleteUser(id){

await fetch("http://localhost:5000/api/users/"+id,{method:"DELETE"})
loadUsers()

}

/* LOAD ORDERS */

async function loadOrders(){

const res=await fetch("http://localhost:5000/api/orders")
const orders=await res.json()

totalOrders.innerText=orders.length

let revenueTotal=0
let html=""

orders.forEach(o=>{

revenueTotal+=o.product.price*o.product.quantity

html+=`

<div class="card">

<div>

<b>${o.product.name}</b><br>
Buyer: ${o.buyer.username}<br>
Address: ${o.buyer.address}<br>
Qty: ${o.product.quantity}

</div>

<button class="complete" onclick="completeOrder('${o._id}')">

Mark Completed

</button>

</div>

`

})

revenue.innerText="₹"+revenueTotal
orderList.innerHTML=html

}

/* COMPLETE ORDER */

async function completeOrder(id){

await fetch("http://localhost:5000/api/orders/"+id,{method:"DELETE"})
loadOrders()

}

/* LOGOUT */

function logout(){

localStorage.removeItem("currentUser")
window.location="login.html"

}

/* INITIAL LOAD */

loadProducts()
loadUsers()
loadOrders()

</script>

</body>
</html>
