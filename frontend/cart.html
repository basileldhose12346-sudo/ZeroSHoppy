<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cart — ZeroShoppy</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
margin:0;
background:#fafafa;
overflow-x:hidden;
}

/* SIDEBAR */

.side-menu{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:#111;
color:white;
padding:20px;
transition:left 0.35s ease;
}

.side-menu.open{
left:0;
}

.side-menu a{
display:block;
color:white;
margin:15px 0;
text-decoration:none
}

/* NAVBAR */

.nav{
background:#fff;
border-bottom:1px solid #e7e7e7;
position:sticky;
top:0;
}

.container{
max-width:1180px;
margin:auto;
padding:0 18px;
}

.nav-inner{
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 0;
}

.menu-btn{font-size:22px;cursor:pointer}

/* CART */

.cart-container{
max-width:900px;
margin:auto;
padding:30px;
}

.item{
background:#fff;
padding:15px;
margin-bottom:10px;
border-radius:10px;
display:flex;
align-items:center;
gap:20px;
}

.item img{
width:70px;
height:70px;
object-fit:contain;
}

.remove-btn{
background:red;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

.checkout-btn{
background:#111;
color:white;
border:none;
padding:10px 14px;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

</style>
</head>

<body>

<div id="sideMenu" class="side-menu">

<h3 id="userName"></h3>
<p id="userEmail"></p>

<a href="newindex.html">Home</a>
<a href="shoes.html">Shoes</a>
<a href="watches.html">Watches</a>
<a href="cart.html">Cart</a>

<hr>

<a onclick="logout()" style="cursor:pointer">Logout</a>

</div>

<header class="nav">
<div class="container nav-inner">

<div style="display:flex;align-items:center;gap:10px">

<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div>
<b>ZeroShoppy</b><br>
<small>Best Quality for Best Price</small>
</div>

</div>

<nav>
<a href="newindex.html">Home</a>
<a href="shoes.html">Shoes</a>
<a href="watches.html">Watches</a>
<a href="cart.html">Cart</a>
</nav>

</div>
</header>

<div class="cart-container">

<h2>Your Cart</h2>

<div id="cartItems"></div>

<button class="checkout-btn" onclick="checkout()">Checkout</button>

</div>

<script>

const user=JSON.parse(localStorage.getItem("currentUser"))

document.getElementById("userName").innerText=user.username
document.getElementById("userEmail").innerText=user.shipping?.email || ""

function toggleMenu(){
document.getElementById("sideMenu").classList.toggle("open")
}

function logout(){
localStorage.removeItem("currentUser")
window.location.href="login.html"
}

let cart=JSON.parse(localStorage.getItem("cart")) || []

function loadCart(){

const container=document.getElementById("cartItems")
container.innerHTML=""

cart.forEach((p,index)=>{

container.innerHTML+=`

<div class="item">

<img src="${p.image}">

<div>

<b>${p.name}</b><br>
₹${p.price}

</div>

<button class="remove-btn" onclick="removeItem(${index})">Remove</button>

</div>

`

})

}

function removeItem(index){

cart.splice(index,1)

localStorage.setItem("cart",JSON.stringify(cart))

loadCart()

}

async function checkout(){

for(let p of cart){

await fetch("http://localhost:5000/api/orders/place",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

productId:p._id,
userId:user._id,
quantity:1

})

})

}

localStorage.removeItem("cart")

alert("Order placed successfully")

window.location.href="newindex.html"

}

loadCart()

</script>

</body>
</html>
