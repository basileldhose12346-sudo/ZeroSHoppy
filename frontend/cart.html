<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cart — ZeroShoppy</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{font-family:Poppins;margin:0;background:#fafafa;overflow-x:hidden;}

/* SIDEBAR */
.side-menu{
position:fixed;top:0;left:-260px;width:260px;height:100%;
background:#111;color:white;padding:20px;
transition:left 0.35s ease;z-index:2000;
display:flex;flex-direction:column;
box-sizing:border-box;
overflow:hidden;
}
.side-menu.open{left:0;}
.side-menu a{display:block;color:white;margin:15px 0;text-decoration:none;font-size:15px;}
.side-menu .side-bottom{margin-top:auto;border-top:1px solid #333;padding-top:15px;}
.side-menu .side-bottom a{color:#ff6b6b;}

/* NAVBAR */
.nav{background:#fff;border-bottom:1px solid #e7e7e7;position:sticky;top:0;z-index:40;}
.container{max-width:1180px;margin:auto;padding:0 18px;}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 0;}
.menu-btn{font-size:22px;cursor:pointer;}

/* CART */
.cart-container{max-width:900px;margin:auto;padding:30px;}

.item{
background:#fff;padding:15px;margin-bottom:10px;
border-radius:10px;display:flex;align-items:center;gap:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.06);
}
.item img{width:70px;height:70px;object-fit:contain;}
.item-info{flex:1;}
.remove-btn{background:red;color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;}
.checkout-btn{background:#111;color:white;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;margin-top:10px;font-size:15px;}
.checkout-btn:disabled{background:#999;cursor:not-allowed;}

.total{font-size:18px;font-weight:700;margin:14px 0;}

/* POPUP */
.popup{
position:fixed;top:30px;left:50%;
transform:translateX(-50%) translateY(-80px);
background:#fff;border-radius:12px;padding:16px 28px;
box-shadow:0 8px 30px rgba(0,0,0,0.15);
display:flex;align-items:center;gap:12px;
font-weight:600;font-size:15px;z-index:9999;
transition:transform 0.4s cubic-bezier(.2,.9,.2,1);
}
.popup.show{transform:translateX(-50%) translateY(0);}
.popup .tick{
width:32px;height:32px;background:#22c55e;
border-radius:50%;display:flex;align-items:center;
justify-content:center;color:white;font-size:18px;
}
.popup.error .tick{background:#ef4444;}
</style>
</head>

<body>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="tick" id="popupTick">✓</div>
  <span id="popupMsg">Done!</span>
</div>

<!-- SIDEBAR -->
<div id="sideMenu" class="side-menu">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h3 id="userName" style="margin:0"></h3>
    <span onclick="toggleMenu()" style="cursor:pointer;font-size:22px;color:white;">✕</span>
  </div>
  <a href="http://localhost:5000/newindex.html">🏠 Home</a>
  <a href="http://localhost:5000/shoes.html">👟 Shoes</a>
  <a href="http://localhost:5000/watches.html">⌚ Watches</a>
  <a href="http://localhost:5000/cart.html">🛒 Cart</a>
  <div class="side-bottom">
    <a onclick="logout()" style="cursor:pointer">🚪 Logout</a>
  </div>
</div>

<header class="nav">
<div class="container nav-inner">
  <div style="display:flex;align-items:center;gap:10px">
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <div>
      <b>ZeroShoppy</b><br>
      <small>Best Quality for Best Price</small>
    </div>
  </div>
</div>
</header>

<div class="cart-container">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <div class="total" id="totalPrice"></div>
  <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">Checkout</button>
</div>

<script>

const user=JSON.parse(localStorage.getItem("currentUser"))
if(!user){ window.location.href="http://localhost:5000/login.html"; throw new Error("Not logged in"); }

document.getElementById("userName").innerText=user.username

function toggleMenu(){
  document.getElementById("sideMenu").classList.toggle("open")
}

function logout(){
  localStorage.removeItem("currentUser")
  window.location.href="http://localhost:5000/login.html"
}

function showPopup(msg, isError=false){
  document.getElementById("popupMsg").innerText=msg
  const p=document.getElementById("popup")
  const tick=document.getElementById("popupTick")
  p.classList.remove("error")
  if(isError){
    p.classList.add("error")
    tick.innerText="✕"
  } else {
    tick.innerText="✓"
  }
  p.classList.add("show")
  setTimeout(()=>p.classList.remove("show"),2500)
}

let cart=JSON.parse(localStorage.getItem("cart"))||[]

function loadCart(){
  const container=document.getElementById("cartItems")
  container.innerHTML=""
  let total=0

  if(cart.length===0){
    container.innerHTML="<p style='color:#777'>Your cart is empty.</p>"
    document.getElementById("totalPrice").innerText=""
    return
  }

  cart.forEach((p,index)=>{
    total+=Number(p.price)
    container.innerHTML+=`
      <div class="item">
        <img src="${p.image}" onerror="this.style.display='none'">
        <div class="item-info">
          <b>${p.name}</b><br>
          ₹${p.price}
          ${p.size ? `<br><small>Size: ${p.size}</small>` : ""}
        </div>
        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
      </div>`
  })

  document.getElementById("totalPrice").innerText="Total: ₹"+total
}

function removeItem(index){
  cart.splice(index,1)
  localStorage.setItem("cart",JSON.stringify(cart))
  loadCart()
}

async function checkout(){
  if(cart.length===0){ showPopup("Your cart is empty!",true); return }

  const btn=document.getElementById("checkoutBtn")
  btn.disabled=true
  btn.innerText="Placing orders..."

  let allSuccess=true
  let failMsg=""

  for(let p of cart){
    try{
      const res=await fetch("http://localhost:5000/api/orders/place",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          productId: p._id,
          userId: user._id,
          quantity: 1,
          size: p.size || null
        })
      })
      const data=await res.json()
      if(!res.ok){
        allSuccess=false
        failMsg=data.message||"Order failed for "+p.name
        break
      }
    } catch(err){
      allSuccess=false
      failMsg="Network error. Check if server is running."
      break
    }
  }

  btn.disabled=false
  btn.innerText="Checkout"

  if(allSuccess){
    localStorage.removeItem("cart")
    cart=[]
    loadCart()
    showPopup("Order placed successfully!")
    setTimeout(()=>window.location.href="http://localhost:5000/newindex.html",2000)
  } else {
    showPopup(failMsg, true)
  }
}

loadCart()
</script>
</body>
</html>
