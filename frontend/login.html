<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - ZeroShoppy</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:"Poppins",sans-serif;
height:100vh;
}

/* BACKGROUND */

.bg{
position:fixed;
inset:0;
background:url("http://localhost:5000/images/bg.jpg") center/cover no-repeat;
filter:blur(10px);
z-index:-1;
}

/* NAVBAR */
.nav{
  background:#fff;
  border-bottom:1px solid #e8e8e8;
  position:sticky;
  top:0;
  z-index:100;
}
.container{
  max-width:1280px;
  margin:auto;
  padding:0 24px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{
  font-family:"Barlow Condensed",sans-serif;
  font-size:22px;font-weight:900;
  letter-spacing:-0.5px;color:#0e0e0e;
  text-decoration:none;
}
.brand span{color:#e8000d;}
.nav-links{display:flex;gap:18px;}
.nav-links a{text-decoration:none;color:#888;font-size:13px;font-weight:500;}
.nav-links a:hover{color:#0e0e0e;}

/* LOGIN BOX */
.wrapper{
  height:calc(100vh - 48px);
  display:flex;
  align-items:center;
  justify-content:center;
}
.login-box{
  width:360px;
  background:rgba(255,255,255,0.93);
  padding:32px 28px;
  border-radius:14px;
  box-shadow:0 0 32px rgba(0,0,0,0.25);
}
.login-box h2{
  font-family:"Barlow Condensed",sans-serif;
  font-size:28px;font-weight:900;
  text-transform:uppercase;letter-spacing:-0.5px;
  margin:0 0 24px 0;text-align:center;
}
.form-group{
  margin-bottom:14px;
}
.form-group label{
  display:block;font-size:11px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  color:#888;margin-bottom:5px;
}
.form-group input{
  width:100%;
  padding:9px 12px;
  border:1.5px solid #e8e8e8;
  border-radius:8px;
  font-family:"Poppins",sans-serif;
  font-size:14px;
  outline:none;
  box-sizing:border-box;
  transition:border-color 0.2s;
}
.form-group input:focus{border-color:#0e0e0e;}
.login-btn-wrap{
  display:flex;
  justify-content:center;
  margin-top:18px;
}
.login-btn{
  width:50%;
  padding:10px;
  background:#111;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-family:"Poppins",sans-serif;
  font-size:14px;font-weight:600;
  transition:background 0.2s;
}
.login-btn:hover{background:#333;}
.links{
  margin-top:16px;
  font-size:12px;
  display:flex;
  justify-content:space-between;
}
.links a{color:#555;text-decoration:none;}
.links a:hover{color:#0e0e0e;}
#msg{color:red;margin-top:10px;font-size:13px;text-align:center;}

</style>
</head>

<body>

<div class="bg"></div>

<!-- NAVBAR -->

<header class="nav">
<div class="container">
  <a href="#" class="brand">ZERO<span>S</span>HOPPY</a>
  <nav class="nav-links">
    <a href="http://localhost:5000/register.html">Register</a>
  </nav>
</div>
</header>

<!-- LOGIN FORM -->

<div class="wrapper">

<div class="login-box">

<h2>Login</h2>

<div class="form-group">
  <label>Username</label>
  <input id="user" placeholder="Enter username">
</div>

<div class="form-group">
  <label>Password</label>
  <input id="pass" type="password" placeholder="Enter password">
</div>

<div class="login-btn-wrap">
  <button class="login-btn" onclick="login()">Login</button>
</div>

<div id="msg"></div>

<div class="links">
  <a href="http://localhost:5000/register.html">Create Account</a>
  <a href="http://localhost:5000/forgot.html">Forgot Password?</a>
</div>

</div>

</div>

<script>

async function login(){

if(user.value==="basiladmin" && pass.value==="abinnivas"){

localStorage.setItem("currentUser",JSON.stringify({
_id:"admin",
username:"basiladmin",
role:"admin"
}))

window.location="admin.html"
return
}

const res=await fetch("http://localhost:5000/api/users/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username:user.value,
password:pass.value
})

})

const data=await res.json()

if(!res.ok){
alert("Invalid username or password")
return
}

localStorage.setItem("currentUser",JSON.stringify(data.user))

if(data.user.role==="admin"){
window.location="admin.html"
}else{
window.location="newindex.html"
}

}

</script>

</body>
</html>
